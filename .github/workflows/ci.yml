name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "ci/**"
      - "refactor/**"
      - "docs/**"
      - "perf/**"

  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  test:
    name: Types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The CPU build of torch is a few hundred MB instead of several GB.
      # llama-cpp-python (compiled from source), torchvision, streamlit and
      # jupyter are not imported by the API or the tests, so they are left out.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          grep -viE '^(llama-cpp-python|torchvision|streamlit|jupyter)\b' requirements-dev.txt \
            | grep -v '^-r ' > ci-requirements.txt
          grep -viE '^(llama-cpp-python|torchvision|streamlit|jupyter)\b' requirements.txt \
            >> ci-requirements.txt
          pip install -r ci-requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-paraphrase-multilingual-minilm-l12-v2

      - name: Type check (mypy)
        run: mypy

      - name: Unit tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Integration tests (MongoDB)
        run: pytest -m integration

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
