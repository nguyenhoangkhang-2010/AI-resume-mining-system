version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ai_resume_mongodb
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    environment:
      MONGO_INITDB_DATABASE: resume_mining_db

  fastapi_app:
    build:
      context: ../
      dockerfile: docker/Dockerfile

    container_name: ai_resume_fastapi
    restart: always

    ports:
      - "8000:8000"

    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data
      - ../storage:/app/storage
      - C:/Users/nguye/.cache/huggingface:/root/.cache/huggingface

    environment:
      MONGO_URI: mongodb://mongodb:27017/
      DB_NAME: resume_mining_db
      MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      FAISS_INDEX_PATH: data/faiss_index/candidate.index

    depends_on:
      - mongodb

volumes:
  mongo_data: