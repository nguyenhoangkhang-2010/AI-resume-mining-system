# API only, using the MongoDB already running on this computer instead of the
# bundled one, so existing data is kept and no Mongo password is needed when
# that MongoDB has none:
#
#   docker compose -f docker-compose.host-db.yml up --build -d
#
# The container reaches the host through host.docker.internal. If your MongoDB
# requires a login, set MONGO_USERNAME and MONGO_PASSWORD in .env.
#
# Keep the api service in step with docker-compose.yml (it is repeated here
# because compose cannot reuse a service without also loading the bundled
# MongoDB and its required password).

name: ai-resume-mining-host-db

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        WITH_LLAMA_CPP: ${WITH_LLAMA_CPP:-true}
        WITH_OCR: ${WITH_OCR:-false}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://host.docker.internal:27017
      MONGO_USERNAME: ${MONGO_USERNAME:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_AUTH_SOURCE: admin
      DB_NAME: ${DB_NAME:-resume_mining_db}
      DB_REQUIRED_AT_STARTUP: "true"
      FAISS_INDEX_PATH: faiss_index/candidate.index
    volumes:
      # Files already on this computer.
      - ./models:/app/models:ro
      - ./data/uploads:/app/data/uploads
      - ./faiss_index:/app/faiss_index
      - hf_cache:/home/appuser/.cache/huggingface

volumes:
  hf_cache:
