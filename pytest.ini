[pytest]
pythonpath = .
timeout = 180
addopts = -m "not slow and not integration"
markers =
    slow: loads a real LLM/HuggingFace model; run with `pytest -m slow`
    integration: needs a running MongoDB (MONGO_URI); run with `pytest -m integration`
    requires_onet: needs the downloaded O*NET files in data/onet/raw (not in git); skipped when missing
